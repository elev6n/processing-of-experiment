name: Build Windows application

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build executable
        run: python build_exe.py
      - name: Check standalone executable
        run: python scripts/check_exe.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ExperimentProcessor-windows-x64
          path: dist/ExperimentProcessor.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ExperimentProcessor-windows-x64
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ExperimentProcessor.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
